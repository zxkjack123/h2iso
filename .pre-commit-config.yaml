repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest-fast
        entry: .venv/bin/python -m pytest tests/ --ignore=tests/benchmark --ignore=tests/e2e --ignore=tests/test_mesh --ignore=tests/test_flowsheet --ignore=tests/property --ignore=tests/test_uq/test_cd2_uq.py --ignore=tests/test_uq/test_isso_uq.py -x --tb=line -q
        language: system
        pass_filenames: false
        always_run: true
