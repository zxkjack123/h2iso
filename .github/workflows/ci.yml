name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-fast-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint
              run: |
                  ruff check src/ tests/
                  ruff format --check src/ tests/

            - name: Fast test
              run: |
                  pytest tests/ \
                    --ignore=tests/benchmark --ignore=tests/e2e \
                    --ignore=tests/test_mesh --ignore=tests/test_flowsheet \
                    --ignore=tests/property \
                    --ignore=tests/test_uq/test_cd2_uq.py \
                    --ignore=tests/test_uq/test_isso_uq.py \
                    -x --tb=short

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.9", "3.11", "3.12"]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -c constraints/ci-3.12.txt -e ".[dev,solver]"

            - name: Lint with ruff
              run: ruff check src/ tests/

            - name: Run tests
              run: pytest tests/ -x --tb=short

    test-solver:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install with solver
              run: |
                  python -m pip install --upgrade pip
                  pip install -c constraints/ci-3.12.txt -e ".[dev,solver]"

            - name: Run all tests including solver (with coverage)
              run: |
                  pytest tests/ --tb=short --cov=h2iso --cov-report=term-missing

    test-wheel:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Build wheel
              run: |
                  python -m pip install --upgrade pip build
                  python -m build --wheel --outdir dist/

            - name: Install wheel in clean venv and smoke test
              run: |
                  python -m venv /tmp/wheel-test-env
                  /tmp/wheel-test-env/bin/pip install --upgrade pip
                  /tmp/wheel-test-env/bin/pip install dist/h2iso-*.whl pytest
                  cd /tmp && /tmp/wheel-test-env/bin/python -c "from h2iso.species import SPECIES_ORDER, N_SPECIES; from h2iso.vle.mixing import bubble_pressure; from h2iso.equilibrator.exchange import equilibrium_composition; import numpy as np; x = np.array([0.5, 0.0, 0.0, 0.5, 0.0, 0.0]); result = bubble_pressure(25.0, x); assert N_SPECIES == 6 and len(SPECIES_ORDER) == 6; print('Smoke OK, bubble_pressure type=', type(result).__name__)"
                  cd ${{ github.workspace }} && /tmp/wheel-test-env/bin/python -m pytest tests/test_data_resources.py -v -o "addopts="

    security-audit:
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install with dev deps
              run: |
                  python -m pip install --upgrade pip pip-audit
                  pip install -e ".[dev]"

            - name: Audit dependencies
              run: pip-audit

    benchmark:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install with dev deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Run performance benchmarks
              run: |
                  pytest tests/benchmark/ --benchmark-enable \
                      --override-ini="addopts=" \
                      --benchmark-json=benchmark_results.json

            - name: Upload benchmark artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-results-${{ github.sha }}
                  path: |
                      benchmark_results.json
                      .benchmarks/
                  if-no-files-found: warn

    e2e-modelica:
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install OpenModelica
              run: |
                  for keyfile in deb.openmodelica.org.gpg.key build.openmodelica.org.key; do
                      wget -qO- "https://openmodelica.org/$keyfile" \
                          | sudo gpg --dearmor -o /etc/apt/keyrings/openmodelica.gpg && break
                  done
                  echo "deb [signed-by=/etc/apt/keyrings/openmodelica.gpg] https://build.openmodelica.org/apt $(lsb_release -cs) release" \
                      | sudo tee /etc/apt/sources.list.d/openmodelica.list
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends omc

            - name: Install h2iso with dev deps
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Run Modelica E2E pytest suite
              run: pytest tests/e2e/ -v --override-ini="addopts=--benchmark-disable"

            - name: Run E2E shell script
              run: bash tests/e2e/test_tricys_init.sh
