name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.9", "3.11", "3.12"]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Lint with ruff
              run: ruff check src/ tests/

            - name: Run tests
              run: pytest tests/ -x --tb=short

    test-solver:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install with solver
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev,solver]"

            - name: Run all tests including solver
              run: pytest tests/ --tb=short

    test-wheel:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Build wheel
              run: |
                  python -m pip install --upgrade pip build
                  python -m build --wheel --outdir dist/

            - name: Install wheel in clean venv and smoke test
              run: |
                  python -m venv /tmp/wheel-test-env
                  /tmp/wheel-test-env/bin/pip install --upgrade pip
                  /tmp/wheel-test-env/bin/pip install dist/h2iso-*.whl pytest
                  cd /tmp && /tmp/wheel-test-env/bin/python -c "from h2iso.species import SPECIES_ORDER, N_SPECIES; from h2iso.vle.mixing import bubble_pressure; from h2iso.equilibrator.exchange import equilibrium_composition; import numpy as np; x = np.array([0.5, 0.0, 0.0, 0.5, 0.0, 0.0]); result = bubble_pressure(25.0, x); assert N_SPECIES == 6 and len(SPECIES_ORDER) == 6; print('Smoke OK, bubble_pressure type=', type(result).__name__)"
                  cd ${{ github.workspace }} && /tmp/wheel-test-env/bin/python -m pytest tests/test_data_resources.py -v
